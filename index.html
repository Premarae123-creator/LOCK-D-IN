<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOCK-D-IN LIVE</title><script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#252038,#090a0f 48%);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:14px}.brand{text-align:center;padding:8px}.brand h1{font-size:clamp(42px,8vw,78px);margin:4px;font-weight:1000}.gold{color:#ffd43b}.tag{color:#c6c2d1;letter-spacing:.13em;font-weight:700}.card{background:#131620eF;border:1px solid #34394b;border-radius:20px;padding:18px;margin-top:13px;box-shadow:0 18px 50px #0008}.hidden{display:none!important}
input,button{font:inherit;border-radius:12px;padding:13px}input{width:100%;background:#090c13;color:white;border:1px solid #3b4257;margin:6px 0 10px}button{border:0;background:#ffd43b;color:#111;font-weight:900;cursor:pointer}button.alt{background:#30384b;color:white}button.danger{background:#ff4967;color:white}.row,.controls,.nav{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.controls button{flex:1;min-width:135px}.nav{justify-content:center;margin:12px 0}.nav button{padding:9px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{border:1px solid #3a4155;border-radius:999px;padding:9px 12px}.small{font-size:13px;color:#aeb5c5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:9px;margin-top:15px}.cell{min-height:86px;background:#1a2030;border:2px solid #364159;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.2s}.cell.open{cursor:pointer}.cell.locked{border-color:#43d7a0}.cell.mine{border-color:#ffd43b;box-shadow:0 0 18px #ffd43b66}.cell.dead{background:#39151e;border-color:#a62f48;opacity:.55;transform:scale(.96)}.num{font-size:27px;font-weight:1000}.who{font-size:12px;max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.feed{max-height:330px;overflow:auto}.feed div{padding:9px 3px;border-bottom:1px solid #292e3e}.winner{text-align:center;border:2px solid #ffd43b;background:#2b2510;border-radius:18px;padding:24px;margin:14px 0}.winner h2{font-size:48px;color:#ffd43b;margin:5px}.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:99;background:#0b0d13;border:3px solid #ff4967;border-radius:22px;padding:22px 28px;text-align:center;box-shadow:0 20px 80px #000;min-width:min(90vw,420px);animation:pop .25s ease}.toast b{font-size:30px}.toast.safe{border-color:#ffd43b}@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}.lobbyList{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.person{padding:11px;border-radius:12px;background:#1a2030;border:1px solid #343c50}.online{color:#48dfa7}.offline{color:#8b93a6}
@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.wrap{padding:9px}.cell{min-height:78px}}
.videoGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px}.videoCard{position:relative;background:#090b10;border:2px solid #343c50;border-radius:16px;overflow:hidden;min-height:150px}.videoCard.hostVideo{border-color:#ffd43b}.videoCard video{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#050609}.videoName{position:absolute;left:8px;bottom:8px;background:#000b;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:900}.chatRow{display:flex;gap:8px;margin-top:12px}.chatRow input{margin:0;flex:1}.hostMark{color:#ffd43b;font-size:11px;font-weight:900}</style></head><body><div id="toast" class="toast hidden"></div><div class="wrap"><div class="brand"><h1>LOCK'D <span class="gold">IN</span> 🔒</h1><div class="tag">LOCK IN • STAY UP • TAKE THE BAG</div></div>
<section id="home" class="card"><h2>Pull Up 👀</h2><input id="name" placeholder="Your display name"><div class="row"><button onclick="showCreate()">CREATE GAME</button><button class="alt" onclick="showJoin()">JOIN GAME</button></div><div id="creator" class="hidden"><input id="title" value="LOCK'D IN LIVE"><input id="size" type="number" min="10" max="100" value="30"><input id="prize" value="$500 CASH"><button onclick="createGame()">OPEN THE BOARD</button></div><div id="joiner" class="hidden"><input id="code" maxlength="4" placeholder="Room code"><button onclick="joinGame()">PULL UP</button></div><p id="err" class="small"></p></section>
<section id="app" class="hidden"><div class="nav"><button class="alt" onclick="view('board')">🔒 BOARD</button><button class="alt" onclick="toggleHangout()">📹 HANGOUT</button></div>
<div id="boardView" class="card"><div class="top"><div><h2 id="titleOut" style="margin:0"></h2><span class="small">ROOM <b class="roomCode"></b> • ROUND <b id="round"></b></span></div><div class="pill">💰 <b id="prizeOut"></b></div></div><div id="winner"></div><div id="hostControls" class="controls hidden"><button onclick="startGame()">CLOSE LOCKS & GO LIVE</button><button class="danger" onclick="dropSpots(1)">💥 DROP 1</button><button class="danger" onclick="dropSpots(3)">😈 DROP 3</button><button class="alt" onclick="runBack()">🔁 RUN IT BACK</button></div><p id="instruction" class="small"></p><div id="grid" class="grid"></div></div>
<div id="feedView" class="card"><div class="top"><h2>LIVE FEED 🔥</h2><div class="pill"><b id="remaining">0</b> STILL UP</div></div><div id="feed" class="feed"></div></div><div id="hangoutView" class="card hidden"><div class="top"><div><h2 style="margin:0">THE HANGOUT 📹</h2><div class="small">Camera + mic are optional. Everyone controls their own permission.</div></div><div class="controls"><button onclick="startAV()">🎥 GO ON CAMERA</button><button class="alt" onclick="stopAV()">CAMERA OFF</button></div></div><div id="videos" class="videoGrid"></div><div class="chatRow"><input id="chatInput" maxlength="180" placeholder="Say something to the room…"><button onclick="sendChat()">SEND</button></div></div></section></div>
<script>
const socket=io(),$=x=>document.getElementById(x);let room='',state=null;
let key=localStorage.getItem('lockdin-key');if(!key){key=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());localStorage.setItem('lockdin-key',key)}
function showCreate(){$('creator').classList.remove('hidden');$('joiner').classList.add('hidden')}function showJoin(){$('joiner').classList.remove('hidden');$('creator').classList.add('hidden')}
function enter(){ $('home').classList.add('hidden');$('app').classList.remove('hidden');view('board') }
function createGame(){const name=$('name').value.trim();if(!name)return $('err').textContent='Enter your name.';socket.emit('create',{name,title:$('title').value,size:$('size').value,prize:$('prize').value,key},r=>{if(!r.ok)return;room=r.code;sessionStorage.setItem('lockdin-room',room);sessionStorage.setItem('lockdin-name',name);enter();sync()})}
function joinGame(){const name=$('name').value.trim();if(!name)return $('err').textContent='Enter your name.';socket.emit('join',{name,code:$('code').value,key},r=>{if(!r.ok)return $('err').textContent=r.msg;room=r.code;sessionStorage.setItem('lockdin-room',room);sessionStorage.setItem('lockdin-name',name);enter();sync()})}
function sync(){if(room)socket.emit('sync',{code:room,key},r=>{if(r&&r.state)render(r.state)})}
function view(v){if(v==='board')$('boardView').classList.remove('hidden')}
function claim(n){socket.emit('claim',{code:room,n,key},r=>{if(!r.ok){showToast(r.msg,true);sync()}})}
function startGame(){socket.emit('start',{code:room,key},r=>{if(r&&!r.ok)showToast(r.msg,true)})}
function dropSpots(n){socket.emit('drop',{code:room,count:n,key},r=>{if(r&&!r.ok)showToast(r.msg,true)})}
function runBack(){if(confirm('Clear EVERY locked spot and start a fresh round?'))socket.emit('runBack',{code:room,key},r=>{if(r&&!r.ok)showToast(r.msg,true)})}
function showToast(msg,safe=false){const t=$('toast');t.className='toast'+(safe?' safe':'');t.innerHTML=`<b>${msg}</b>`;setTimeout(()=>t.classList.add('hidden'),2800)}
function render(r){if(room&&r.code!==room)return;state=r;document.querySelectorAll('.roomCode').forEach(x=>x.textContent=r.code);$('titleOut').innerHTML=r.title+(r.hostKey===key?' <span class="hostMark">★ YOU ARE HOST</span>':'');$('round').textContent=r.round;$('prizeOut').textContent=r.prize;$('hostControls').classList.toggle('hidden',r.hostKey!==key);
 const me=r.players.find(p=>p.key===key);$('instruction').textContent=r.status==='lobby'?(me?.spot?`YOU'RE LOCK'D IN AT #${me.spot}. Everybody can see it.`:'Tap an OPEN spot to lock in.'):(r.status==='live'?'LOCKS CLOSED. Watch the drops live.':'ROUND COMPLETE.');
 const g=$('grid');g.innerHTML='';r.cells.forEach(c=>{const d=document.createElement('div');d.className='cell '+(c.dropped?'dead':c.ownerKey===key?'mine':c.ownerKey?'locked':'open');d.innerHTML=`<div class="num">${String(c.n).padStart(2,'0')}</div><div class="who">${c.dropped?'DROPPED ❌':c.ownerName||'OPEN'}</div>`;if(r.status==='lobby'&&!c.ownerKey)d.onclick=()=>claim(c.n);g.appendChild(d)});
 $('remaining').textContent=r.cells.filter(c=>c.ownerKey&&!c.dropped).length;$('feed').innerHTML=r.log.slice().reverse().map(x=>`<div>${x.msg}</div>`).join('');$('winner').innerHTML=r.winner?`<div class="winner"><div>🏆 LAST SPOT STANDING 🏆</div><h2>#${r.winner.n}</h2><h3>${r.winner.name}</h3><div>${r.prize}</div><h3>TOOK THE BAG 💰</h3></div>`:'';
}
let localStream=null,pcs={},peerNames={};function toggleHangout(){$('hangoutView').classList.toggle('hidden')}
async function startAV(){try{if(!localStream)localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});addVideo(key,sessionStorage.getItem('lockdin-name')||'You',localStream,true);socket.emit('rtc-ready',{code:room,key});$('hangoutView').classList.remove('hidden')}catch(e){showToast('Camera/mic permission was not granted.',true)}}
function stopAV(){if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}Object.values(pcs).forEach(pc=>pc.close());pcs={};$('videos').innerHTML='';socket.emit('rtc-off',{code:room,key})}
function addVideo(k,name,stream,isLocal=false){let card=document.getElementById('vid-'+k);if(!card){card=document.createElement('div');card.id='vid-'+k;card.className='videoCard';card.innerHTML=`<video autoplay playsinline ${isLocal?'muted':''}></video><div class="videoName"></div>`;$('videos').appendChild(card)}card.querySelector('video').srcObject=stream;let label=name+(isLocal?' (YOU)':'');if(state&&state.hostKey===k){card.classList.add('hostVideo');label='⭐ HOST • '+label}card.querySelector('.videoName').textContent=label}
function makePC(otherKey,name){if(pcs[otherKey])return pcs[otherKey];const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pcs[otherKey]=pc;peerNames[otherKey]=name||'Player';if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate)socket.emit('rtc-signal',{code:room,to:otherKey,from:key,data:{candidate:e.candidate}})};pc.ontrack=e=>addVideo(otherKey,peerNames[otherKey],e.streams[0],false);return pc}
socket.on('rtc-peer',async({key:otherKey,name})=>{if(!localStream)return;const pc=makePC(otherKey,name);const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit('rtc-signal',{code:room,to:otherKey,from:key,data:{sdp:pc.localDescription}})});
socket.on('rtc-signal',async({from,data})=>{if(!localStream)return;const p=state?.players.find(x=>x.key===from),pc=makePC(from,p?.name||'Player');if(data.sdp){await pc.setRemoteDescription(data.sdp);if(data.sdp.type==='offer'){const ans=await pc.createAnswer();await pc.setLocalDescription(ans);socket.emit('rtc-signal',{code:room,to:from,from:key,data:{sdp:pc.localDescription}})}}else if(data.candidate){try{await pc.addIceCandidate(data.candidate)}catch(e){}}});
socket.on('rtc-remove',({key:k})=>{pcs[k]?.close();delete pcs[k];document.getElementById('vid-'+k)?.remove()});function sendChat(){const i=$('chatInput'),text=i.value.trim();if(!text)return;socket.emit('chat',{code:room,key,text},()=>{});i.value=''};$('chatInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});

socket.on('state',render);socket.on('dropEvent',e=>{if(e.drops?.length)showToast(`💥 ${e.drops.map(n=>'#'+n).join(', ')} DROPPED!`);});socket.on('roundReset',e=>{showToast(`🔁 ROUND ${e.round} — RUN IT BACK!`,true);view('board')});
socket.on('connect',()=>{if(room)sync()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
const saved=sessionStorage.getItem('lockdin-room'),savedName=sessionStorage.getItem('lockdin-name');if(saved&&savedName){room=saved;$('name').value=savedName;socket.emit('join',{name:savedName,code:room,key},r=>{if(r.ok){enter();sync()}else{sessionStorage.clear();room=''}})}
</script></body></html>
