<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOCK-D-IN LIVE</title><script src="/socket.io/socket.io.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.brand{text-align:center}.brand h1{font-size:clamp(42px,8vw,80px);margin:15px 0 0;letter-spacing:.05em}.brand b{color:#ffd23f}.tag{color:#b7bdc9;letter-spacing:.15em}.card{background:#141824;border:1px solid #30384a;border-radius:20px;padding:20px;margin-top:18px}input,button{font:inherit;padding:13px;border-radius:12px}input{width:100%;margin:6px 0 10px;background:#0b0e15;color:#fff;border:1px solid #384157}button{border:0;background:#ffd23f;font-weight:bold;cursor:pointer}button.alt{background:#2d3547;color:white}button.drop{background:#ff4965;color:white}.row,.controls{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{padding:9px 12px;border:1px solid #374057;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:9px;margin-top:18px}.cell{min-height:82px;border:2px solid #344057;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a2030}.cell.open{cursor:pointer}.cell.mine{border-color:#ffd23f;box-shadow:0 0 15px #ffd23f55}.cell.dead{background:#35151d;border-color:#9b3045;opacity:.55}.num{font-size:25px;font-weight:900}.who{font-size:12px;color:#d5d9e2;max-width:85px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.controls{margin:15px 0}.controls button{flex:1;min-width:135px}.winner{text-align:center;border:2px solid #ffd23f;border-radius:18px;padding:24px;margin:15px 0;background:#2a2511}.winner h2{font-size:44px;color:#ffd23f;margin:5px}.feed div{padding:7px;border-bottom:1px solid #282f40}.small{color:#aeb6c5;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.wrap{padding:11px}}</style></head>
<body><div class="wrap"><div class="brand"><h1>LOCK-D-<b>IN</b></h1><div class="tag">LOCK IN • STAY UP • GET PAID</div></div>
<div id="home" class="card"><h2>Pull Up & Lock In 🔒</h2><input id="name" placeholder="Your display name"><div class="row"><button onclick="createBox()">CREATE GAME</button><button class="alt" onclick="joinBox()">JOIN GAME</button></div>
<div id="creator" class="hidden"><input id="title" value="LOCK-D-IN LIVE" placeholder="Game title"><input id="size" type="number" value="30" min="10" max="100"><input id="prize" value="$500 CASH" placeholder="Prize"><button onclick="create()">OPEN THE BOARD</button></div>
<div id="joiner" class="hidden"><input id="code" maxlength="4" placeholder="Room code"><button onclick="join()">LOCK INTO ROOM</button></div><p id="err" class="small"></p></div>
<div id="game" class="hidden"><div class="card"><div class="top"><div><h2 id="titleOut" style="margin:0"></h2><span class="small">ROOM <b id="room"></b> • ROUND <b id="round"></b></span></div><div class="pill">💰 <b id="prizeOut"></b></div><div class="pill" id="status"></div></div><div id="winner"></div>
<div id="host" class="controls hidden"><button onclick="start()">CLOSE LOCKS & GO LIVE</button><button class="drop" onclick="drop(1)">DROP 1</button><button class="drop" onclick="drop(3)">DROP 3</button><button class="alt" onclick="fresh()">RUN IT BACK</button></div>
<p id="instruction" class="small"></p><div id="grid" class="grid"></div></div><div class="card"><h3>LIVE FEED 🔥</h3><div id="feed" class="feed"></div></div></div></div>
<script>const s=io();let room='';const $=x=>document.getElementById(x);function createBox(){$('creator').classList.remove('hidden');$('joiner').classList.add('hidden')}function joinBox(){$('joiner').classList.remove('hidden');$('creator').classList.add('hidden')}function enter(){$('home').classList.add('hidden');$('game').classList.remove('hidden')}
function create(){if(!$('name').value.trim())return $('err').textContent='Enter your name.';s.emit('create',{name:$('name').value,title:$('title').value,size:$('size').value,prize:$('prize').value},r=>{if(!r.ok)return;room=r.code;enter()})}
function join(){if(!$('name').value.trim())return $('err').textContent='Enter your name.';s.emit('join',{name:$('name').value,code:$('code').value},r=>{if(!r.ok)return $('err').textContent=r.msg;room=r.code;enter()})}
function claim(n){s.emit('claim',{code:room,n},r=>{if(!r.ok)alert(r.msg)})}function start(){s.emit('start',room)}function drop(n){s.emit('drop',{code:room,count:n})}function fresh(){if(confirm('Clear the board and RUN IT BACK?'))s.emit('newRound',room)}
s.on('state',r=>{if(room&&r.code!==room)return;$('titleOut').textContent=r.title;$('room').textContent=r.code;$('round').textContent=r.round;$('prizeOut').textContent=r.prize;$('status').textContent=r.status.toUpperCase();$('host').classList.toggle('hidden',r.host!==s.id);const me=r.players.find(p=>p.id===s.id);$('instruction').textContent=r.status==='lobby'?(me?.spot?`YOU'RE LOCK'D IN AT #${me.spot}.`:'Tap an OPEN number to lock your spot.'):(r.status==='live'?'LOCKS CLOSED. Stay up. 👀':'Round complete.');$('winner').innerHTML=r.winner?`<div class="winner"><div>🏆 LAST SPOT STANDING 🏆</div><h2>#${r.winner.n}</h2><h3>${r.winner.name}</h3><div>${r.prize}</div><h3>YOU GOT PAID 💰</h3></div>`:'';const g=$('grid');g.innerHTML='';r.cells.forEach(c=>{const d=document.createElement('div');d.className='cell '+(c.dropped?'dead':c.owner===s.id?'mine':c.owner?'locked':'open');d.innerHTML=`<div class="num">${String(c.n).padStart(2,'0')}</div><div class="who">${c.dropped?'DROPPED ❌':c.ownerName||'OPEN'}</div>`;if(r.status==='lobby'&&!c.owner)d.onclick=()=>claim(c.n);g.appendChild(d)});$('feed').innerHTML=r.log.slice().reverse().map(x=>`<div>${x}</div>`).join('')})</script></body></html>
