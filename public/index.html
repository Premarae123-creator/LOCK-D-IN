<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>LOCK'D IN — Live Game Show</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020204;font-family:Arial,Helvetica,sans-serif}
#game{position:fixed;inset:0;z-index:1}#game canvas{display:block}
#mediaLayer{position:fixed;inset:0;z-index:20;pointer-events:none}
.playerVideo{position:absolute;border-radius:50%;object-fit:cover;background:#08090c;border:3px solid #e7ad35;box-shadow:0 0 18px #e7ad3566;pointer-events:auto;transform:scaleX(-1)}
.playerVideo.remote{transform:none}.playerVideo.speaking{box-shadow:0 0 8px #ffe084,0 0 28px #ffd34d,0 0 50px #ff9b22}
.mediaControls{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mediaControls button{border:1px solid #e7ad35;border-radius:999px;background:#090a0dcc;color:#fff;padding:10px 14px;font-weight:900;cursor:pointer}
.mediaControls button.on{background:#8e1022}.hidden{display:none!important}
@media(max-width:700px){.mediaControls{right:8px;bottom:8px}.mediaControls button{padding:8px 10px;font-size:12px}}
</style>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head><body>
<div id="game"></div><div id="mediaLayer"></div>
<div id="mediaControls" class="mediaControls hidden">
<button id="cameraBtn">📹 CAMERA</button><button id="micBtn">🎙️ MIC</button><button id="avatarBtn">👤 AVATAR</button>
</div>
<script type="module" src="/game/main.js"></script>
</body></html>
