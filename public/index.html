<style>

input,button{font:inherit;border-radius:12px;padding:13px}input{width:100%;background:#090c13;color:white;border:1px solid #3b4257;margin:6px 0 10px}button{border:0;background:#ffd43b;color:#111;font-weight:900;cursor:pointer}button.alt{background:#30384b;color:white}button.danger{background:#ff4967;color:white}.row,.controls,.nav{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.controls button{flex:1;min-width:135px}.nav{justify-content:center;margin:12px 0}.nav button{padding:9px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{border:1px solid #3a4155;border-radius:999px;padding:9px 12px}.small{font-size:13px;color:#aeb5c5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:9px;margin-top:15px}.cell{min-height:86px;background:#1a2030;border:2px solid #364159;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.2s}.cell.open{cursor:pointer}.cell.locked{border-color:#43d7a0}.cell.mine{border-color:#ffd43b;box-shadow:0 0 18px #ffd43b66}.cell.dead{background:#39151e;border-color:#a62f48;opacity:.55;transform:scale(.96)}.num{font-size:27px;font-weight:1000}.who{font-size:12px;max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.feed{max-height:330px;overflow:auto}.feed div{padding:9px 3px;border-bottom:1px solid #292e3e}.winner{text-align:center;border:2px solid #ffd43b;background:#2b2510;border-radius:18px;padding:24px;margin:14px 0}.winner h2{font-size:48px;color:#ffd43b;margin:5px}.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:99;background:#0b0d13;border:3px solid #ff4967;border-radius:22px;padding:22px 28px;text-align:center;box-shadow:0 20px 80px #000;min-width:min(90vw,420px);animation:pop .25s ease}.toast b{font-size:30px}.toast.safe{border-color:#ffd43b}@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}.lobbyList{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.person{padding:11px;border-radius:12px;background:#1a2030;border:1px solid #343c50}.online{color:#48dfa7}.offline{color:#8b93a6}

.videoGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px}.videoCard{position:relative;background:#090b10;border:2px solid #343c50;border-radius:16px;overflow:hidden;min-height:150px}.videoCard.hostVideo{border-color:#ffd43b}.videoCard video{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#050609}.videoName{position:absolute;left:8px;bottom:8px;background:#000b;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:900}.chatRow{display:flex;gap:8px;margin-top:12px}.chatRow input{margin:0;flex:1}.hostMark{color:#ffd43b;font-size:11px;font-weight:900}.cell{position:relative;overflow:hidden}.cell.locked{animation:lockPulse .48s ease}.cell.dead:after{content:'💥';position:absolute;font-size:38px;animation:boom .7s ease forwards}.finalFive{animation:finalGlow 1s ease-in-out infinite alternate}.countOverlay{position:fixed;inset:0;z-index:500;background:#05060bef;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.countNum{font-size:min(35vw,260px);font-weight:1000;color:#ffd43b;text-shadow:0 0 45px #ffd43b88;animation:countPop .65s ease}.countText{font-size:clamp(22px,5vw,52px);font-weight:1000}.dropBanner{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:520;background:#130b10;border:3px solid #ff4967;border-radius:24px;padding:28px 42px;text-align:center;box-shadow:0 0 80px #ff496777;animation:bannerPop .35s ease}.dropBanner .big{font-size:clamp(42px,10vw,100px);font-weight:1000}.winnerFx{position:fixed;inset:0;pointer-events:none;z-index:490;overflow:hidden}.confetti{position:absolute;top:-30px;font-size:26px;animation:fall 3.2s linear forwards}@keyframes lockPulse{0%{transform:scale(.75)}55%{transform:scale(1.08);box-shadow:0 0 35px #ffd43b}100%{transform:scale(1)}}@keyframes boom{0%{transform:scale(.2);opacity:0}45%{transform:scale(1.6);opacity:1}100%{transform:scale(2.2);opacity:0}}@keyframes finalGlow{from{box-shadow:0 0 8px #ffd43b55}to{box-shadow:0 0 30px #ffd43bcc;border-color:#ffd43b}}@keyframes countPop{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}@keyframes bannerPop{from{transform:translate(-50%,-50%) scale(.5);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}@keyframes fall{to{transform:translateY(110vh) rotate(900deg);opacity:.9}}
/* v3.1 cinematic drop animation */
.elimStage{position:fixed;inset:0;z-index:900;background:radial-gradient(circle at 50% 65%,#4a0a12 0,#17070b 28%,#05060a 70%);overflow:hidden;display:flex;align-items:center;justify-content:center;perspective:1000px}

.elimPit{position:absolute;bottom:-7vh;width:min(72vw,760px);height:min(24vw,220px);border-radius:50%;background:radial-gradient(ellipse,#ff3b42 0,#8d0713 22%,#210006 50%,#000 72%);box-shadow:0 0 90px #ff314d88,inset 0 0 45px #000;border:8px solid #301117}

@keyframes verdictPop{0%{opacity:0;transform:scale(.4) rotate(-8deg)}70%{opacity:1;transform:scale(1.15) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}

<div id="eliminationStage" class="elimStage hidden">

</div><div id='countOverlay' class='countOverlay hidden'></div><div id='dropBanner' class='dropBanner hidden'></div><div id='winnerFx' class='winnerFx'></div><div id="toast" class="toast hidden"></div><div class="wrap"><div class="brand"><h1>LOCK'D <span class="gold">IN</span> 🔒</h1><div class="tag">LOCK IN • STAY UP • TAKE THE BAG</div></div>
<section id="home" class="card"><h2>Pull Up 👀</h2><input id="name" placeholder="Your display name"><div class="row"><button onclick="showCreate()">CREATE GAME</button><button class="alt" onclick="showJoin()">JOIN GAME</button></div><div id="creator" class="hidden"><input id="title" value="LOCK'D IN LIVE"><input id="size" type="number" min="10" max="100" value="30"><input id="prize" value="$500 CASH"><button onclick="createGame()">OPEN THE BOARD</button></div><div id="joiner" class="hidden"><input id="code" maxlength="4" placeholder="Room code"><button onclick="joinGame()">PULL UP</button></div><p id="err" class="small"></p></section>
<section id="app" class="hidden"><div class="nav"><button class="alt" onclick="view('board')">🔒 BOARD</button><button class="alt" onclick="toggleHangout()">📹 HANGOUT</button></div>
<div id="boardView" class="card"><div class="top"><div><h2 id="titleOut" style="margin:0"></h2><span class="small">ROOM <b class="roomCode"></b> • ROUND <b id="round"></b></span></div><div class="pill">💰 <b id="prizeOut"></b></div></div><div id="winner"></div><div id="hostControls" class="controls hidden"><button onclick="startGame()">CLOSE LOCKS & GO LIVE</button><button class="danger" onclick="dropSpots(1)">💥 DROP 1</button><button class="danger" onclick="dropSpots(3)">😈 DROP 3</button><button class="alt" onclick="runBack()">🔁 RUN IT BACK</button></div><p id="instruction" class="small"></p><div id="grid" class="grid"></div></div>
<div id="feedView" class="card"><div class="top"><h2>LIVE FEED 🔥</h2><div class="pill"><b id="remaining">0</b> STILL UP</div></div><div id="feed" class="feed"></div></div><div id="hangoutView" class="card hidden"><div class="top"><div><h2 style="margin:0">THE HANGOUT 📹</h2><div class="small">Camera + mic are optional. Everyone controls their own permission.</div></div><div class="controls"><button onclick="startAV()">🎥 GO ON CAMERA</button><button class="alt" onclick="stopAV()">CAMERA OFF</button></div></div><div id="videos" class="videoGrid"></div><div class="chatRow"><input id="chatInput" maxlength="180" placeholder="Say something to the room…"><button onclick="sendChat()">SEND</button></div></div></section></div>
<script>
const socket=io(),$=x=>document.getElementById(x);let room='',state=null;
let key=localStorage.getItem('lockdin-key');if(!key){key=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());localStorage.setItem('lockdin-key',key)}
function showCreate(){$('creator').classList.remove('hidden');$('joiner').classList.add('hidden')}function showJoin(){$('joiner').classList.remove('hidden');$('creator').classList.add('hidden')}
function enter(){ $('home').classList.add('hidden');$('app').classList.remove('hidden');view('board') }
function createGame(){const name=$('name').value.trim();if(!name)return $('err').textContent='Enter your name.';socket.emit('create',{name,title:$('title').value,size:$('size').value,prize:$('prize').value,key},r=>{if(!r.ok)return;room=r.code;sessionStorage.setItem('lockdin-room',room);sessionStorage.setItem('lockdin-name',name);enter();sync()})}
function joinGame(){const name=$('name').value.trim();if(!name)return $('err').textContent='Enter your name.';socket.emit('join',{name,code:$('code').value,key},r=>{if(!r.ok)return $('err').textContent=r.msg;room=r.code;sessionStorage.setItem('lockdin-room',room);sessionStorage.setItem('lockdin-name',name);enter();sync()})}
function sync(){if(room)socket.emit('sync',{code:room,key},r=>{if(r&&r.state)render(r.state)})}
function view(v){if(v==='board')$('boardView').classList.remove('hidden')}
function claim(n){socket.emit('claim',{code:room,n,key},r=>{if(!r.ok){showToast(r.msg,true);sync()}})}
function startGame(){socket.emit('start',{code:room,key},r=>{if(r&&!r.ok)showToast(r.msg,true)})}
function dropSpots(n){socket.emit('drop',{code:room,count:n,key},r=>{if(r&&!r.ok)showToast(r.msg,true)})}
function runBack(){if(confirm('Clear EVERY locked spot and start a fresh round?'))socket.emit('runBack',{code:room,key},r=>{if(r&&!r.ok)showToast(r.msg,true)})}
function showToast(msg,safe=false){const t=$('toast');t.className='toast'+(safe?' safe':'');t.innerHTML=`<b>${msg}</b>`;setTimeout(()=>t.classList.add('hidden'),2800)}
function render(r){if(room&&r.code!==room)return;state=r;document.querySelectorAll('.roomCode').forEach(x=>x.textContent=r.code);$('titleOut').innerHTML=r.title+(r.hostKey===key?' <span class="hostMark">★ YOU ARE HOST</span>':'');$('round').textContent=r.round;$('prizeOut').textContent=r.prize;$('hostControls').classList.toggle('hidden',r.hostKey!==key);
 const me=r.players.find(p=>p.key===key);$('instruction').textContent=r.status==='lobby'?(me?.spot?`YOU'RE LOCK'D IN AT #${me.spot}. Everybody can see it.`:'Tap an OPEN spot to lock in.'):(r.status==='live'?'LOCKS CLOSED. Watch the drops live.':'ROUND COMPLETE.');
 const g=$('grid');g.innerHTML='';r.cells.forEach(c=>{const d=document.createElement('div');d.className='cell '+(c.dropped?'dead':c.ownerKey===key?'mine':c.ownerKey?'locked':'open');d.innerHTML=`<div class="num">${String(c.n).padStart(2,'0')}</div><div class="who">${c.dropped?'DROPPED ❌':c.ownerName||'OPEN'}</div>`;if(r.status==='lobby'&&!c.ownerKey)d.onclick=()=>claim(c.n);g.appendChild(d)});
 $('remaining').textContent=r.cells.filter(c=>c.ownerKey&&!c.dropped).length;$('feed').innerHTML=r.log.slice().reverse().map(x=>`<div>${x.msg}</div>`).join('');$('winner').innerHTML=r.winner?`<div class="winner"><div>🏆 LAST SPOT STANDING 🏆</div><h2>#${r.winner.n}</h2><h3>${r.winner.name}</h3><div>${r.prize}</div><h3>TOOK THE BAG 💰</h3></div>`:'';
}
let localStream=null,pcs={},peerNames={},iceQueues={};
function toggleHangout(){$('hangoutView').classList.toggle('hidden')}
async function startAV(){
 try{
  if(!localStream)localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  addVideo(key,sessionStorage.getItem('lockdin-name')||'You',localStream,true);
  socket.emit('rtc-ready',{code:room,key});
  $('hangoutView').classList.remove('hidden');
 }catch(e){showToast('Camera/mic permission was not granted.',true)}
}
function stopAV(){
 if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
 Object.values(pcs).forEach(pc=>pc.close());pcs={};iceQueues={};$('videos').innerHTML='';
 socket.emit('rtc-off',{code:room,key});
}
function addVideo(k,name,stream,isLocal=false){
 let card=document.getElementById('vid-'+k);
 if(!card){
  card=document.createElement('div');card.id='vid-'+k;card.className='videoCard';
  card.innerHTML=`<video autoplay playsinline ${isLocal?'muted':''}></video><div class="videoName"></div>`;
  $('videos').appendChild(card)
 }
 const v=card.querySelector('video');
 if(v.srcObject!==stream)v.srcObject=stream;
 v.autoplay=true;v.playsInline=true;
 if(isLocal)v.muted=true;
 v.play().catch(()=>{});
 let label=name+(isLocal?' (YOU)':'');
 if(state&&state.hostKey===k){card.classList.add('hostVideo');label='⭐ HOST • '+label}
 card.querySelector('.videoName').textContent=label;
}
function makePC(otherKey,name){
 if(pcs[otherKey])return pcs[otherKey];
 const pc=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]});
 pcs[otherKey]=pc;peerNames[otherKey]=name||'Player';iceQueues[otherKey]=iceQueues[otherKey]||[];
 if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 pc.onicecandidate=e=>{
  if(e.candidate)socket.emit('rtc-signal',{code:room,to:otherKey,from:key,data:{candidate:e.candidate}})
 };
 pc.ontrack=e=>{
  const stream=e.streams&&e.streams[0]?e.streams[0]:new MediaStream([e.track]);
  addVideo(otherKey,peerNames[otherKey],stream,false);
 };
 pc.onconnectionstatechange=()=>{
  if(pc.connectionState==='connected')showToast(`📹 Connected to ${peerNames[otherKey]}`,true);
  if(['failed','closed'].includes(pc.connectionState)){
   document.getElementById('vid-'+otherKey)?.remove();
  }
 };
 return pc;
}
async function flushIce(otherKey){
 const pc=pcs[otherKey];if(!pc||!pc.remoteDescription)return;
 const q=iceQueues[otherKey]||[];iceQueues[otherKey]=[];
 for(const c of q){try{await pc.addIceCandidate(c)}catch(e){}}
}
socket.on('rtc-peer',async({key:otherKey,name})=>{
 if(!localStream||otherKey===key)return;
 const pc=makePC(otherKey,name);
 // Only one side creates the offer. This prevents both phones from offering at once.
 if(String(key)<String(otherKey) && pc.signalingState==='stable'){
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('rtc-signal',{code:room,to:otherKey,from:key,data:{sdp:pc.localDescription}});
 }
});
socket.on('rtc-signal',async({from,data})=>{
 if(!localStream||from===key)return;
 const p=state?.players.find(x=>x.key===from),pc=makePC(from,p?.name||'Player');
 try{
  if(data.sdp){
   await pc.setRemoteDescription(data.sdp);
   await flushIce(from);
   if(data.sdp.type==='offer'){
    const ans=await pc.createAnswer();
    await pc.setLocalDescription(ans);
    socket.emit('rtc-signal',{code:room,to:from,from:key,data:{sdp:pc.localDescription}});
   }
  }else if(data.candidate){
   if(pc.remoteDescription)await pc.addIceCandidate(data.candidate);
   else (iceQueues[from]||(iceQueues[from]=[])).push(data.candidate);
  }
 }catch(e){console.warn('WebRTC signal error',e)}
});
socket.on('rtc-remove',({key:k})=>{
 pcs[k]?.close();delete pcs[k];delete iceQueues[k];document.getElementById('vid-'+k)?.remove()
});
function sendChat(){
 const i=$('chatInput'),text=i.value.trim();if(!text)return;
 socket.emit('chat',{code:room,key,text},()=>{});i.value=''
}
$('chatInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});

let lastWinnerKey='';const sleep=ms=>new Promise(r=>setTimeout(r,ms));function tone(f=440,d=.12){try{const A=window.AudioContext||window.webkitAudioContext,c=tone.c||(tone.c=new A()),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d)}catch(e){}}async function countdown(label){const o=$('countOverlay');o.classList.remove('hidden');for(const n of ['3','2','1']){o.innerHTML=`<div class="countText">${label}</div><div class="countNum">${n}</div>`;tone(300+(4-Number(n))*100,.18);await sleep(650)}o.classList.add('hidden')}async function dramaticDrop(nums){const b=$('dropBanner');b.innerHTML=`<div>💥 GOT DROPPED 💥</div><div class="big">${nums.map(n=>'#'+String(n).padStart(2,'0')).join(' • ')}</div>`;b.classList.remove('hidden');tone(120,.5);await sleep(1600);b.classList.add('hidden')}function confetti(){const box=$('winnerFx');box.innerHTML='';const bits=['💰','✨','🔒','💸','⭐'];for(let i=0;i<55;i++){const d=document.createElement('div');d.className='confetti';d.textContent=bits[i%bits.length];d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*1.2+'s';box.appendChild(d)}setTimeout(()=>box.innerHTML='',5000);tone(660,.2);setTimeout(()=>tone(880,.3),200)}
socket.on('state',render);async function cinematicDrop(dropNumber){
 const c=state?.cells?.find(x=>x.n===dropNumber),name=c?.ownerName||'PLAYER';
 const stage=$('eliminationStage'),card=$('elimCard');
 $('elimNumber').textContent=String(dropNumber).padStart(2,'0');
 $('elimName').textContent=name;
 $('elimPrompt').textContent="SOMEBODY'S ABOUT TO GET DROPPED 👀";
 $('elimVerdict').textContent='GOT DROPPED!';
 stage.classList.remove('hidden','falling');stage.classList.add('reveal');
 await sleep(650);
 for(const n of ['3','2','1']){
   $('elimPrompt').textContent=`HOLD UP... ${n}`;
   tone(300+(4-Number(n))*110,.22);await sleep(620);
 }
 $('elimPrompt').textContent=`#${String(dropNumber).padStart(2,'0')} — ${name}`;
 await sleep(450);
 stage.classList.remove('reveal');stage.classList.add('falling');tone(105,.75);
 await sleep(1800);
 stage.classList.add('hidden');stage.classList.remove('falling');
}
socket.on('dropEvent',async e=>{
 if(e.drops?.length){
   for(const n of e.drops) await cinematicDrop(n);
 }
 if(e.winner)confetti();
});socket.on('roundReset',e=>{showToast(`🔁 ROUND ${e.round} — RUN IT BACK!`,true);view('board')});
socket.on('connect',()=>{if(room)sync()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
const saved=sessionStorage.getItem('lockdin-room'),savedName=sessionStorage.getItem('lockdin-name');if(saved&&savedName){room=saved;$('name').value=savedName;socket.emit('join',{name:savedName,code:room,key},r=>{if(r.ok){enter();sync()}else{sessionStorage.clear();room=''}})}
